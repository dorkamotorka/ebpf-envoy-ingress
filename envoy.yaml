static_resources:
  listeners:
  - name: listener_http
    address:
      socket_address:
        address: 0.0.0.0 
        port_value: 8080
    # ask the kernel for the original dst (which we set in our eBPF hook)
    listener_filters:
    - name: envoy.filters.listener.original_dst
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst

    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: ingress_tcp
          cluster: original-dst
          # Add this to ensure idle connections don't drop during long tests
          idle_timeout: 0s

  clusters:
  # dial whatever address the listener restored from SO_ORIGINAL_DST
  - name: original-dst
    type: ORIGINAL_DST
    connect_timeout: 1s
    lb_policy: CLUSTER_PROVIDED
    # Append the SO_MARK to the upstream connection to
    # avoid re-redirection - check eBPF program code comments
    upstream_bind_config:
      socket_options:
      - level: 1        # SOL_SOCKET
        name: 36        # SO_MARK (Linux)
        int_value: 4242
        state: STATE_PREBIND

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
