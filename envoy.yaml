static_resources:
  listeners:
  - name: listener_http
    address:
      socket_address:
        address: 127.0.0.1
        port_value: 8080
    # ask the kernel for the original dst (which we set in our eBPF hook)
    listener_filters:
    - name: envoy.filters.listener.original_dst
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst

    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http

          route_config:
            name: echo_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              # BLOCK /param endpoint
              - match:
                  prefix: "/param"
                direct_response:
                  status: 403
                  body:
                    inline_string: "Access to /param is blocked by Envoy"
              # forward to the ORIGINAL_DST cluster (restored by listener filter)
              - match:
                  prefix: "/"
                route:
                  cluster: original-dst

          http_filters:
          - name: envoy.filters.http.original_src
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.original_src.v3.OriginalSrc
              mark: 4242
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  start_time: "%START_TIME%"
                  method: "%REQ(:METHOD)%"
                  path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  protocol: "%PROTOCOL%"
                  host_header: "%REQ(:AUTHORITY)%"
                  route_name: "%ROUTE_NAME%"
                  virtual_cluster: "%VIRTUAL_CLUSTER_NAME%"
                  upstream_cluster: "%UPSTREAM_CLUSTER%"
                  upstream_host: "%UPSTREAM_HOST%"
                  response_code: "%RESPONSE_CODE%"
                  response_flags: "%RESPONSE_FLAGS%"
                  duration_ms: "%DURATION%"
                  downstream_remote: "%DOWNSTREAM_REMOTE_ADDRESS%"
                  request_id: "%REQ(X-REQUEST-ID)%"

  clusters:
  # dial whatever address the listener restored from SO_ORIGINAL_DST
  - name: original-dst
    type: ORIGINAL_DST
    connect_timeout: 1s
    lb_policy: CLUSTER_PROVIDED

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
