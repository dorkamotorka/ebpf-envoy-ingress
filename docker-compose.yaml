services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: envoy
    depends_on:
      - echo
    network_mode: host
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    restart: unless-stopped

  echo:
    image: ealen/echo-server
    container_name: echo
    network_mode: host
    restart: unless-stopped
